{% extends "base.html" %} {% block content %}
<h1 class="text-3xl font-bold text-gray-800 text-center mb-8 animate-slide-up">
  <i class="fas fa-brain mr-2 text-teal-600"></i>Prediction Result
</h1>
<div
  class="{% if prediction == 'Churned' %}churned{% else %}retained{% endif %} glass animate-slide-up"
>
  <i
    class="fas {% if prediction == 'Churned' %}fa-exclamation-triangle{% else %}fa-check-circle{% endif %} mr-2 text-teal-600"
  ></i>
  Predicted Status: {{ prediction }}
</div>
<div class="text-center text-gray-800 mt-6 glass p-6 animate-slide-up">
  <p>
    <i class="fas fa-percentage mr-2 text-teal-600"></i
    ><b>Probability of Churn:</b> {{ churn_prob }}
  </p>
  <p>
    <i class="fas fa-percentage mr-2 text-teal-600"></i
    ><b>Probability of Retention:</b> {{ retain_prob }}
  </p>
</div>

{% if justification %}
<div
  class="mt-8 mx-auto max-w-3xl bg-gray-50 border-l-4 border-teal-400 p-6 shadow animate-slide-up"
>
  <h2 class="text-xl font-semibold text-teal-700 mb-2">
    <i class="fas fa-lightbulb mr-2"></i>AI Justification
  </h2>
  <p class="text-gray-800 whitespace-pre-line">{{ justification }}</p>
</div>
{% endif %}

<div class="text-center mt-6">
  <a href="/predict" class="predict-btn inline-block"
    ><i class="fas fa-redo mr-2"></i>Try Another Prediction</a
  >
</div>
{% endblock %}
