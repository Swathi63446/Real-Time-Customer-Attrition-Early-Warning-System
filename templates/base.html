<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Churn Prediction</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f4f7fa;
        font-family: "Poppins", sans-serif;
        color: #2d3748;
      }
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }
      .glass:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      }
      .navbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
      }
      .nav-link {
        color: #2d3748;
        transition: all 0.3s ease;
      }
      .nav-link:hover {
        color: #319795;
        transform: translateY(-1px);
      }
      .churned {
        background: rgba(255, 99, 71, 0.2);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 99, 71, 0.3);
        border-radius: 0.75rem;
        padding: 1.5rem;
        text-align: center;
        font-weight: 600;
        color: #2d3748;
        animation: fadeIn 0.5s ease-in-out;
      }
      .retained {
        background: rgba(56, 178, 172, 0.2);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(56, 178, 172, 0.3);
        border-radius: 0.75rem;
        padding: 1.5rem;
        text-align: center;
        font-weight: 600;
        color: #2d3748;
        animation: fadeIn 0.5s ease-in-out;
      }
      .predict-btn {
        background: linear-gradient(90deg, #319795, #3182ce);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        transition: all 0.3s ease;
        font-weight: 600;
      }
      .predict-btn:hover {
        background: linear-gradient(90deg, #3182ce, #319795);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      }
      .input-field {
        transition: all 0.3s ease;
      }
      .input-field:hover {
        transform: translateY(-2px);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slide-up {
        animation: slideUp 0.6s ease-in-out;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <nav class="navbar p-4">
      <div class="container mx-auto flex justify-between items-center">
        <a href="/" class="text-2xl font-bold text-gray-800"
          ><i class="fas fa-chart-line mr-2 text-teal-600"></i>Churn
          Predictor</a
        >
        <div class="space-x-6">
          <a href="/" class="nav-link font-medium"
            ><i class="fas fa-home mr-1"></i>Home</a
          >
          <a href="/about" class="nav-link font-medium"
            ><i class="fas fa-info-circle mr-1"></i>About</a
          >
          <a href="/predict" class="nav-link font-medium"
            ><i class="fas fa-brain mr-1"></i>Predict</a
          >
          <a href="/faq" class="nav-link font-medium"
            ><i class="fas fa-question-circle mr-1"></i>FAQ</a
          >
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-6">
      {% block content %} {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="glass p-6">
      <div class="container mx-auto text-center text-gray-800">
        <p>
          <i class="fas fa-envelope mr-2 text-teal-600"></i>Contact:
          support@churnpredictor.com
        </p>
        <p>
          <i class="fas fa-copyright mr-2 text-teal-600"></i>2025 Churn
          Predictor. All rights reserved.
        </p>
        <div class="mt-4 space-x-4">
          <a href="#" class="text-gray-800 hover:text-teal-600"
            ><i class="fab fa-twitter"></i
          ></a>
          <a href="#" class="text-gray-800 hover:text-teal-600"
            ><i class="fab fa-linkedin"></i
          ></a>
          <a href="#" class="text-gray-800 hover:text-teal-600"
            ><i class="fab fa-github"></i
          ></a>
        </div>
      </div>
    </footer>
  </body>
</html>
